<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino教學 | 小軒個人網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/headhead.png">
    <link rel="stylesheet" href="css/Arduino.css">
</head>

<body>
    <header>
        <h1><a href="index.html">小軒的網站</a></h1>
        <ul>
            <li><a href="index.html">首頁</a></li>
            <li><a href="aboutme.html">關於我</a></li>
            <li><a href="more.html">作品</a></li>
        </ul>
        <button class="menu-toggle" aria-label="切換選單">☰</button>
        <div class="overlay"></div>
    </header>

    <div class="news"></div>

    <script>
        const toggleButton = document.querySelector('.menu-toggle');
        const menu = document.querySelector('ul');
        const overlay = document.querySelector('.overlay');

        toggleButton.addEventListener('click', () => {
            menu.classList.toggle('show');
            overlay.classList.toggle('show');
        });

        overlay.addEventListener('click', () => {
            menu.classList.remove('show');
            overlay.classList.remove('show');
        });
    </script>
</body>

</html>
